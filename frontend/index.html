<!-- frontend\index.html -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>REACH Foundation</title>
  <meta name="title" content="REACH Foundation" />
  <meta name="description" content="REACH Foundation - Empowering communities through stories and impact." />
  <meta name="keywords" content="REACH, foundation, community, stories, NGO, impact" />
  <meta name="author" content="REACH Foundation" />

  <!-- Theme Color (Mobile UI) -->
  <meta name="theme-color" content="#7c3aed" />

<!-- Favicon (optimized & Firefox-safe) -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="shortcut icon" href="/favicon.ico" />

<!-- Apple -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

<!-- Manifest -->
<link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="REACH Foundation" />
  <meta property="og:description" content="Empowering communities through stories and meaningful impact." />
  <meta property="og:image" content="https://reachfoundationngo.com/preview.png" />
  <meta property="og:url" content="https://reachfoundationngo.com" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="REACH Foundation" />
  <meta name="twitter:description" content="Empowering communities through stories and meaningful impact." />
  <meta name="twitter:image" content="https://reachfoundationngo.com/preview.png" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />

  <!-- Preconnect (faster font loading if used later) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link href="https://fonts.googleapis.com/css2?family=Gelasio&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
